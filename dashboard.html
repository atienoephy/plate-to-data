<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Wastebin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="wrap nav">
            <a href="index.html" class="brand"><span class="dot"></span>Wastebin</a>
            <nav class="nav-links">
                <a href="dashboard.html" style="color:var(--stamp-red);">Dashboard</a>
                <a href="log.html">+ New Log</a>
            </nav>
        </div>
    </header>

    <section style="padding-top:40px; padding-bottom:80px;">
        <div class="wrap">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; margin-bottom:32px;">
                <div>
                    <div class="eyebrow">Analytics</div>
                    <h2 style="font-family:var(--display); font-size:2rem; margin:0;">Your Waste Report</h2>
                </div>
                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <button onclick="exportCSV()" style="background:var(--paper); color:var(--ink); border:none; padding:10px 18px; font-family:var(--mono); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.06em; cursor:pointer; border-radius:2px;">
                        📥 Export CSV
                    </button>
                    <button onclick="clearAllData()" style="background:#B8431C; color:white; border:none; padding:10px 18px; font-family:var(--mono); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.06em; cursor:pointer; border-radius:2px;">
                        🗑️ Clear Data
                    </button>
                </div>
            </div>

            <!-- Dashboard Content -->
            <div id="dashboardContent">
                <!-- Will be filled by JavaScript -->
                <div style="text-align:center; padding:40px; color:#7a7566;">
                    Loading...
                </div>
            </div>
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
